[project]
name = "fabriks"
dynamic = ["version"]
description = "a level-of-detail mesh wire format: octree-partitioned surfaces written to any object store"
authors = [{ name = "jhnnsrs", email = "jhnnsrs@gmail.com" }]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
# fabriks builds mesh collections, so everything that takes part in building one is a
# dependency rather than an extra. `trimesh` cuts a mesh at the cell planes and
# `fast-simplification` makes the coarse levels (QUADRIC); reaching a remote store and the
# MESHOPT simplifier and codec are optional.
#
# scipy and shapely are named because trimesh does not require them and the clipper does.
# trimesh hard-depends on numpy alone -- both of these sit in its `easy` extra -- while
# `slice_mesh_plane` imports `scipy.spatial.cKDTree` and `trimesh.path.polygons` (an unguarded
# `from shapely import ops`) in its function body. Verified by blocking each import in turn:
# cutting a single box fails without either, at `cap=False` as well as `cap=True`.
dependencies = [
    "numpy>=1.26",
    "pyarrow>=12",
    "trimesh>=4.0",
    "scipy>=1.11",
    "shapely>=2.0",
    "fast-simplification>=0.1.7",
]

[project.optional-dependencies]
# Writing to S3 (or anywhere else obstore reaches). fabriks only needs three methods off a
# store, so this is for callers who want one rather than a directory.
obstore = ["obstore>=0.10"]
# `simplification: MESHOPT` (the default when it is installed) and `codec: MESHOPT`. An extra
# because PyPI ships meshoptimizer as source only: installing it needs a C++ compiler, which a
# slim image does not have. The MESHOPT simplifier declares `meshopt_simplifyWithAttributes`
# with its `vertex_lock` argument itself (the binding leaves it undeclared), so the bundled
# library must have it; every published binding is a pre-release, hence the pre-release floor.
meshopt = ["meshoptimizer>=0.2.30a0"]
complete = ["obstore>=0.10", "meshoptimizer>=0.2.30a0"]

[tool.hatch.build.targets.sdist]
include = ["fabriks"]

[tool.hatch.build.targets.wheel]
include = ["fabriks"]

[tool.pytest.ini_options]
markers = [
    "meshopt: marks tests that require the meshopt extra",
    "obstore: marks tests that require the obstore extra",
]

[[tool.pydoc-markdown.loaders]]
type = "python"
search_path = ["fabriks"]

[tool.pydoc-markdown.renderer]
type = "docusaurus"
docs_base_path = "website/docs"

[tool.semantic_release]
# No version_toml/version_variables: the release version lives only in the git
# tag, which hatch-vcs reads at build time. CI runs the version command with
# `commit: false`, so PSR tags HEAD and creates the GitHub Release without
# pushing a bump commit to the branch.
#
# The semantic-release GitHub Action runs in a Docker container without uv, so
# install it first. PSR builds *before* it tags, so hatch-vcs is told the new
# version explicitly ($NEW_VERSION is injected by PSR) instead of deriving a
# `.devN+g...` local version that PyPI would reject.
build_command = """
    python -m pip install 'uv>=0.7.12'
    export SETUPTOOLS_SCM_PRETEND_VERSION="$NEW_VERSION"
    uv build
"""

# main -> stable X.Y.Z. next -> prereleases X.Y.Z-rc.N. N.x -> maintenance.
[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.next]
match = "next"
prerelease = true
prerelease_token = "rc"

# Maintenance branches (1.x, 2.x, ...) cut stable patch/minor releases for an
# older major after a new major has shipped from main.
[tool.semantic_release.branches.maintenance]
match = '^\d+\.x$'
prerelease = false

# Keep the changelog focused on user-facing changes. These patterns only filter
# what's rendered -- they do not affect version bumps.
[tool.semantic_release.changelog]
exclude_commit_patterns = [
    '^chore(?:\([^)]*\))?: ',
    '^ci(?:\([^)]*\))?: ',
    '^build(?:\([^)]*\))?: ',
    '^style(?:\([^)]*\))?: ',
    '^test(?:\([^)]*\))?: ',
    '^Merge ',
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The version is derived from the nearest git tag (vX.Y.Z); nothing in the
# tree is bumped on release. Shallow CI clones see no tag and get the fallback.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "python-semantic-release>=9.21.0",
    "ruff==0.17.6",
    "basedpyright==1.40.2",
    "obstore>=0.10",
    "pyarrow-stubs>=20.0.0.20260625",
]
